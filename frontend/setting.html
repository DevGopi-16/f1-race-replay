<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Settings | F1+ Replay</title>
  <link rel="stylesheet" href="/static/auth.css">
  <link rel="stylesheet" href="/static/profile.css">
  <script src="/static/settings_applier.js"></script>
</head>
<body>
  <div class="bg-glow-orb orb-1"></div>
  <div class="bg-glow-orb orb-2"></div>

  <div class="profile-container glass-card" style="max-width: 650px; margin: 40px auto; padding: 30px;">
    <div class="profile-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <div class="profile-title">
        <h1 style="font-size:22px; margin:0; color:#fff;">⚙️ TERMINAL SETTINGS</h1>
        <p style="font-size:12px; color:#94a3b8; margin-top:4px;">Configure telemetry preferences, default metrics, and units.</p>
      </div>
      <a href="/profile" class="glass-btn" style="width: auto; padding: 8px 16px; font-size:12px; text-decoration:none;">← Back to Profile</a>
    </div>

    <form id="settings-form">
      <div class="glass-subcard" style="margin-bottom: 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 16px;">
        <div class="form-group" style="margin-bottom:14px;">
          <label style="display:block; font-size:11px; color:#8a9bb8; margin-bottom:6px;">DEFAULT TELEMETRY METRICS</label>
          <select id="set-metrics" class="glass-input" style="width:100%; padding:10px; background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:6px;">
            <option value="speed,throttle,brake">Speed, Throttle, Brake</option>
            <option value="speed,gear,drs">Speed, Gear, DRS</option>
            <option value="throttle,brake,rpm">Throttle, Brake, RPM</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label style="display:block; font-size:11px; color:#8a9bb8; margin-bottom:6px;">DEFAULT DRIVER COMPARISON</label>
          <input type="text" id="set-driver" class="glass-input" style="width:100%; padding:10px; background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:6px;" value="VER" />
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label style="display:block; font-size:11px; color:#8a9bb8; margin-bottom:6px;">UNITS</label>
          <select id="set-units" class="glass-input" style="width:100%; padding:10px; background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:6px;">
            <option value="metric">Metric (km/h, °C)</option>
            <option value="imperial">Imperial (mph, °F)</option>
          </select>
        </div>
      </div>

      <div id="settings-msg" style="margin-bottom: 15px; font-size: 13px; text-align: center;"></div>
      <button type="submit" id="settings-submit-btn" class="glass-btn" style="width:100%; padding:12px; background:#e10600; color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer;">SAVE PREFERENCES</button>
    </form>
  </div>
  
  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const setMetrics = document.getElementById("set-metrics");
    const setDriver = document.getElementById("set-driver");
    const setUnits = document.getElementById("set-units");
    const msg = document.getElementById("settings-msg");
    const submitBtn = document.getElementById("settings-submit-btn");
    const form = document.getElementById("settings-form");

    function forceLogout() {
      localStorage.removeItem("f1_replay_token");
      localStorage.removeItem("f1_replay_units");
      localStorage.removeItem("f1_replay_metrics");
      localStorage.removeItem("f1_replay_driver");
      window.location.href = "/";
    }

    async function syncSettingsForm() {
      const token = localStorage.getItem("f1_replay_token");
      if (!token) { window.location.href = "/"; return; }

      // 1. Set values immediately from localStorage for zero delay/flicker
      const cachedUnits = localStorage.getItem("f1_replay_units");
      const cachedMetrics = localStorage.getItem("f1_replay_metrics");
      const cachedDriver = localStorage.getItem("f1_replay_driver");

      if (cachedUnits) setUnits.value = cachedUnits;
      if (cachedMetrics) setMetrics.value = cachedMetrics;
      if (cachedDriver) setDriver.value = cachedDriver;

      // 2. Sync with backend
      try {
        const res = await fetch("/auth/settings", {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (res.status === 401) { forceLogout(); return; }

        if (res.ok) {
          const settings = await res.json();
          
          const activeUnits = localStorage.getItem("f1_replay_units") || settings.units || "metric";
          const activeMetrics = localStorage.getItem("f1_replay_metrics") || settings.telemetry_preferences || "speed,throttle,brake";
          const activeDriver = localStorage.getItem("f1_replay_driver") || settings.default_driver_comp || "VER";

          setUnits.value = activeUnits;
          setMetrics.value = activeMetrics;
          setDriver.value = activeDriver;

          localStorage.setItem("f1_replay_units", activeUnits);
          localStorage.setItem("f1_replay_metrics", activeMetrics);
          localStorage.setItem("f1_replay_driver", activeDriver);
        }
      } catch (e) {
        console.error("[Settings] Failed to load settings:", e);
      }
    }

    await syncSettingsForm();

    window.addEventListener("pageshow", (event) => {
      if (event.persisted) { syncSettingsForm(); }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "Updating settings...";
      msg.style.color = "#94a3b8";
      submitBtn.disabled = true;

      const token = localStorage.getItem("f1_replay_token");
      const selectedUnits = setUnits.value;
      const selectedMetrics = setMetrics.value;
      const selectedDriver = setDriver.value.trim();

      if (!selectedDriver) {
        msg.textContent = "Default driver comparison can't be empty.";
        msg.style.color = "#ef4444";
        submitBtn.disabled = false;
        return;
      }

      // Lock to LocalStorage immediately
      localStorage.setItem("f1_replay_units", selectedUnits);
      localStorage.setItem("f1_replay_metrics", selectedMetrics);
      localStorage.setItem("f1_replay_driver", selectedDriver);

      try {
        const resp = await fetch("/auth/settings", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            telemetry_preferences: selectedMetrics,
            default_driver_comp: selectedDriver,
            units: selectedUnits
          })
        });

        if (resp.status === 401) {
          forceLogout();
          return;
        }

        if (resp.ok) {
          if (window.userSettings) {
            window.userSettings.units = selectedUnits;
            window.userSettings.telemetry_preferences = selectedMetrics;
            window.userSettings.default_driver_comp = selectedDriver;
          }

          if (typeof window.refreshUserSettingsUI === "function") {
            window.refreshUserSettingsUI();
          }

          msg.textContent = "Settings saved successfully!";
          msg.style.color = "#22c55e";
        } else {
          msg.textContent = "Saved locally!";
          msg.style.color = "#22c55e";
        }
      } catch (err) {
        msg.textContent = "Saved locally!";
        msg.style.color = "#22c55e";
      } finally {
        submitBtn.disabled = false;
      }
    });
  });
</script>
</body>
</html>
